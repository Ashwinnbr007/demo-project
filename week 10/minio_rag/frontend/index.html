<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bucket Chat</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='8' fill='%23e8893f'/%3E%3Cpath d='M9 11h14M9 16h14M9 21h9' stroke='%231a1209' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">Bucket Chat</span>
        </div>
        <button class="icon-btn only-mobile" id="close-sidebar" aria-label="Close sidebar">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>

      <button class="new-chat" id="new-chat">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        New chat
      </button>

      <nav class="history" id="history" aria-label="Conversations"></nav>

      <section class="panel" aria-labelledby="ingest-title">
        <h2 id="ingest-title" class="panel-title">Knowledge base</h2>
        <label class="field">
          <span>Bucket prefix <em>(optional)</em></span>
          <input id="prefix" type="text" placeholder="e.g. reports/" autocomplete="off">
        </label>
        <button class="ingest-btn" id="ingest-btn">
          <svg viewBox="0 0 24 24" width="15" height="15"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          <span>Ingest from MinIO</span>
        </button>
        <div class="ingest-result" id="ingest-result" hidden></div>
      </section>

      <div class="status" id="status">
        <span class="dot"></span><span class="status-text">Connecting…</span>
      </div>
    </aside>

    <div class="scrim" id="scrim"></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="open-sidebar" aria-label="Open sidebar">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <div class="mode-switch" role="tablist" aria-label="Mode">
          <button role="tab" class="mode active" data-mode="ask" aria-selected="true">Ask</button>
          <button role="tab" class="mode" data-mode="retrieve" aria-selected="false">Search only</button>
        </div>
        <label class="topk">
          <span>Top</span>
          <select id="limit">
            <option>3</option><option selected>5</option><option>8</option><option>10</option>
          </select>
        </label>
      </header>

      <section class="thread" id="thread" aria-live="polite"></section>

      <footer class="composer-wrap">
        <form class="composer" id="composer">
          <textarea id="input" rows="1" placeholder="Ask anything about your documents…" autocomplete="off"></textarea>
          <button type="submit" class="send" id="send" aria-label="Send">
            <svg class="icon-send" viewBox="0 0 24 24" width="18" height="18"><path d="M12 19V5m0 0l-6 6m6-6l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
            <svg class="icon-stop" viewBox="0 0 24 24" width="14" height="14"><rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor"/></svg>
          </button>
        </form>
        <p class="hint">Answers come from your MinIO documents through a local model. Enter to send, Shift + Enter for a new line.</p>
      </footer>
    </main>
  </div>

  <template id="empty-tpl">
    <div class="empty">
      <h1>What's in the <em>bucket</em>?</h1>
      <p>Ask a question and get an answer grounded in the documents you've ingested, with sources.</p>
      <div class="suggestions">
        <button class="suggestion">Summarise the main topics across my documents</button>
        <button class="suggestion">What is Qdrant and how does it store data?</button>
        <button class="suggestion">What does MinIO do?</button>
        <button class="suggestion">List any key definitions mentioned</button>
      </div>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
